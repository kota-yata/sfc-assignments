<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>X提案アプリ (X-suggestion)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-window" role="application" aria-label="X提案アプリ">
      <header class="app-titlebar">
        <div class="app-dots" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <h1 class="app-title">X提案アプリ</h1>
        <div class="app-status" id="apiStatus">API: mock</div>
      </header>

      <section class="app-body">
        <label class="visually-hidden" for="promptInput">お題（1行の自然言語）</label>
        <input
          id="promptInput"
          class="prompt-input"
          type="text"
          placeholder="例: 3万円で2泊3日の京都旅行プラン / 冷蔵庫: 卵, 鶏むね肉, ねぎ で献立 / 春で白と紫の寄せ植え / チルな夜のプレイリスト"
          autocomplete="off"
          maxlength="500"
          aria-describedby="inputHelp"
        />
        <div id="inputHelp" class="help-text">入力は1行のみ。内容から最適な『X提案』を生成します。</div>

        <div class="controls">
          <button id="generateBtn" class="btn primary">生成する</button>
          <button id="clearBtn" class="btn ghost" title="結果をクリア">クリア</button>
          <details class="api-config">
            <summary>API設定</summary>
            <div class="api-config-body">
              <label for="apiKey">Gemini API Key</label>
              <input id="apiKey" type="password" placeholder="AIza... (任意)" />
              <label for="modelSelect">Model</label>
              <select id="modelSelect">
                <option value="gemini-1.5-flash-latest" selected>gemini-1.5-flash-latest</option>
                <option value="gemini-1.5-pro-latest">gemini-1.5-pro-latest</option>
                <option value="gemini-1.0-pro">gemini-1.0-pro</option>
              </select>
              <label class="checkbox">
                <input id="forceMock" type="checkbox" />
                <span>モックで生成（APIを使わない）</span>
              </label>
              <div class="hint">キーを保存するとブラウザの localStorage に保持されます。</div>
              <div class="row">
                <button id="saveSettings" class="btn">保存</button>
                <button id="clearSettings" class="btn">設定を消去</button>
              </div>
            </div>
          </details>
        </div>

        <section id="result" class="result" aria-live="polite" aria-busy="false"></section>
      </section>

      <footer class="app-footer">
        <div>
          テーマ: 旅行プラン / 献立・レシピ / 寄せ植え植物 / 音楽プレイリスト 他
        </div>
        <div class="credit">Powered by Gemini (ダミーAPIキー対応・モック内蔵)</div>
      </footer>
    </main>

    <script src="app.js"></script>
  </body>
  </html>
